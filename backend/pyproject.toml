[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soumik Maity", email = "soumik.maity@geogo.in" }
]
requires-python = ">=3.11"
dependencies = [
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# app/ is run in place (uvicorn app.main:app), not installed as a package.
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]
