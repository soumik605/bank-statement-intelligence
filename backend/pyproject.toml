[project]
name = "backend"
version = "0.1.0"
description = "Bank statement intelligence backend"
authors = [
    { name = "Soumik Maity", email = "soumik.maity@geogo.in" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "pandas>=3.0.6",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
# app/ is run in place, not installed as a package.
package = false

[dependency-groups]
dev = [
    "pypdf>=6.20.1",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
