[project]
name = "backend"
version = "0.1.0"
description = "Bank statement intelligence backend"
authors = [
    { name = "Soumik Maity", email = "soumik.maity@geogo.in" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.0",
]

[tool.uv]
# app/ is run in place, not installed as a package.
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
